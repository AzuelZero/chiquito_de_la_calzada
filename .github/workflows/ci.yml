name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pruebas y compilación
    runs-on: windows-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true
          cache: true

      - name: Comprobar el formato
        shell: pwsh
        run: |
          $bad = gofmt -l .
          if ($bad) {
            Write-Error "Estos archivos no están formateados:`n$bad"
            exit 1
          }

      - name: Analizar con go vet
        run: go vet ./...

      - name: Pruebas de datecore y de la CLI
        run: go test ./...

      - name: Pruebas del backend de la GUI
        run: go test -tags "gui desktop production" ./gui

      - name: Fuzz (humo)
        run: go test -run=^$ -fuzz=FuzzBuildICS -fuzztime=15s ./datecore

      - name: Buscar vulnerabilidades conocidas
        run: go run golang.org/x/vuln/cmd/govulncheck@latest -tags "gui desktop production" ./...

      - name: Compilar la CLI (amd64)
        run: go build -trimpath -o build/chiquito_de_la_calzada_cli.exe .

      - name: Compilar la GUI (amd64)
        run: go build -tags "gui desktop production" -trimpath -ldflags "-H windowsgui -s -w" -o build/chiquito_de_la_calzada.exe ./gui

      - name: Compilar la GUI (arm64)
        shell: pwsh
        run: |
          # El rsrc.syso versionado es amd64; para probar arm64 se aparta.
          Move-Item gui/rsrc.syso gui/rsrc.amd64.bak
          try {
            $env:GOOS = "windows"
            $env:GOARCH = "arm64"
            $env:CGO_ENABLED = "0"
            go build -tags "gui desktop production" -trimpath -ldflags "-H windowsgui -s -w" -o build/chiquito_de_la_calzada_arm64.exe ./gui
          } finally {
            Move-Item gui/rsrc.amd64.bak gui/rsrc.syso
          }
