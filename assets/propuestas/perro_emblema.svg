<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Emblema de un perro fumando">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2D114C"/>
      <stop offset="0.55" stop-color="#302570"/>
      <stop offset="1" stop-color="#2F0734"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#58A6D8" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#2C418A" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2C418A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#D6F1FF"/>
      <stop offset="0.45" stop-color="#8FD0FF"/>
      <stop offset="1" stop-color="#4C8FC0"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#4C8FC0"/>
      <stop offset="1" stop-color="#2C418A"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE0AE"/>
      <stop offset="0.5" stop-color="#FF9A4D"/>
      <stop offset="1" stop-color="#E2571F"/>
    </radialGradient>
    <clipPath id="badge">
      <rect width="1024" height="1024" rx="228"/>
    </clipPath>
  </defs>

  <g clip-path="url(#badge)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <circle cx="512" cy="470" r="470" fill="url(#glow)"/>
    <circle cx="512" cy="500" r="414" fill="none" stroke="#8FD0FF" stroke-opacity="0.15" stroke-width="6"/>
    <circle cx="512" cy="500" r="446" fill="none" stroke="#8FD0FF" stroke-opacity="0.07" stroke-width="2"/>

    <!-- cuello y cabeza -->
    <path d="M 410 832
             C 350 760 318 666 322 570
             C 326 470 372 392 452 344
             C 510 308 590 304 654 334
             C 704 358 736 398 750 446
             C 790 452 830 470 856 498
             C 878 524 876 554 850 572
             C 820 594 780 596 748 582
             C 730 610 704 632 672 644
             C 644 654 616 656 590 650
             C 566 692 542 748 532 800
             L 524 836 Z"
          fill="url(#fur)"/>

    <!-- oreja caída sobre la mejilla -->
    <path d="M 430 360
             C 370 360 320 410 300 480
             C 282 548 300 620 348 664
             C 380 694 420 694 440 668
             C 432 612 424 548 428 490
             C 430 440 434 392 430 360 Z"
          fill="url(#ear)"/>
    <path d="M 404 412
             C 358 454 336 524 346 592
             C 354 640 376 672 402 690
             C 412 636 414 552 408 486 Z"
          fill="#190524" opacity="0.34"/>
    <path d="M 432 398
             C 404 442 394 502 398 562"
          fill="none" stroke="#8FD0FF" stroke-width="8" opacity="0.3" stroke-linecap="round"/>

    <!-- ojo y ceja -->
    <path d="M 602 448
             C 626 422 674 422 698 446
             C 674 470 626 472 602 448 Z"
          fill="#190524"/>
    <circle cx="658" cy="440" r="7" fill="#EAF7FF"/>
    <path d="M 596 408 C 632 388 680 390 708 410" fill="none" stroke="#190524" stroke-width="12" stroke-linecap="round"/>

    <!-- hocico claro -->
    <path d="M 700 468
             C 758 450 818 462 854 498
             C 874 520 870 550 846 566
             C 808 592 758 586 724 562
             C 700 544 690 498 700 468 Z"
          fill="#EAF7FF" opacity="0.2"/>

    <!-- nariz -->
    <path d="M 806 510
             C 830 500 858 512 864 534
             C 870 558 850 574 826 566
             C 804 558 796 524 806 510 Z"
          fill="#190524"/>
    <ellipse cx="830" cy="522" rx="7" ry="5" fill="#8FD0FF" opacity="0.8"/>

    <!-- boca -->
    <path d="M 748 606 C 780 618 812 616 836 602" fill="none" stroke="#190524" stroke-width="10" stroke-linecap="round"/>

    <!-- cigarrillo -->
    <path d="M 752 610 L 906 552" stroke="#190524" stroke-width="32" stroke-linecap="round"/>
    <path d="M 752 610 L 906 552" stroke="#F2E9D8" stroke-width="18" stroke-linecap="round"/>
    <path d="M 752 610 L 790 596" stroke="#C9A97A" stroke-width="18"/>
    <path d="M 782 599 L 790 596" stroke="#8A6A45" stroke-width="18" opacity="0.55"/>
    <circle cx="910" cy="550" r="15" fill="url(#ember)"/>

    <!-- humo -->
    <path d="M 926 530
             C 958 498 908 468 938 436
             C 962 410 930 384 942 356"
          fill="none" stroke="#BFE9FF" stroke-width="9" opacity="0.5" stroke-linecap="round"/>
    <path d="M 938 562
             C 962 544 940 520 956 504"
          fill="none" stroke="#BFE9FF" stroke-width="6" opacity="0.28" stroke-linecap="round"/>

    <!-- collar -->
    <path d="M 404 798
             C 480 836 576 840 650 808
             L 664 854
             C 580 894 470 888 390 846 Z"
          fill="#2C418A"/>
    <circle cx="530" cy="842" r="19" fill="#FFB15C"/>
    <circle cx="530" cy="842" r="7" fill="#C9A97A"/>

    <!-- brillo -->
    <path d="M 452 400
             C 492 366 552 352 610 360"
          fill="none" stroke="#EAF7FF" stroke-width="14" opacity="0.28" stroke-linecap="round"/>
    <path d="M 500 690
             C 538 700 576 698 610 684"
          fill="none" stroke="#2C418A" stroke-width="10" opacity="0.35" stroke-linecap="round"/>
  </g>
</svg>
