<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Cartel nocturno de un perro fumando">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#3A1A5E"/>
      <stop offset="0.5" stop-color="#230A3A"/>
      <stop offset="1" stop-color="#120018"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.28" r="0.62">
      <stop offset="0" stop-color="#8FD0FF" stop-opacity="0.2"/>
      <stop offset="0.55" stop-color="#58A6D8" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#120018" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C418A" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#120018" stop-opacity="0"/>
