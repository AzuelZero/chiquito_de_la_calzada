<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Perro fumando un cigarrillo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2D114C"/>
      <stop offset="0.55" stop-color="#302570"/>
      <stop offset="1" stop-color="#2F0734"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.52" cy="0.46" r="0.52">
      <stop offset="0" stop-color="#327AAC" stop-opacity="0.75"/>
      <stop offset="0.65" stop-color="#2C418A" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2C418A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#9BD8F7"/>
      <stop offset="0.5" stop-color="#5BA3D2"/>
      <stop offset="1" stop-color="#327AAC"/>
    </linearGradient>
    <linearGradient id="ear" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#4C8FC0"/>
      <stop offset="1" stop-color="#2C418A"/>
    </linearGradient>
    <linearGradient id="muzzle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8F7FF"/>
      <stop offset="1" stop-color="#A9D3EC"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE0AE"/>
      <stop offset="0.5" stop-color="#FF9A4D"/>
      <stop offset="1" stop-color="#E2571F"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <circle cx="512" cy="480" r="410" fill="url(#glow)"/>

  <g stroke="#190524" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">
    <!-- oreja caída -->
    <path d="M 372 334
             C 306 354 260 428 252 518
             C 244 606 274 682 334 724
             C 366 684 378 620 378 558
             C 378 476 384 388 372 334 Z"
          fill="url(#ear)"/>
    <path d="M 342 400
             C 304 450 286 524 292 590
             C 298 642 316 682 340 706
             C 354 664 360 612 360 556
             C 360 498 354 440 342 400 Z"
          fill="#2D114C" opacity="0.45" stroke="none"/>

    <!-- cabeza y cuello -->
    <path d="M 334 350
             C 402 290 504 272 590 300
             C 652 320 700 358 724 408
             C 764 416 816 432 856 462
             C 892 490 906 526 890 558
             C 872 594 830 610 788 602
             C 758 648 712 682 660 698
             C 630 706 600 708 570 704
             C 530 718 480 720 440 706
             C 424 702 416 700 410 700
             C 382 680 360 648 348 610
             C 320 560 312 500 316 440
             C 320 388 322 366 334 350 Z"
          fill="url(#fur)"/>

    <!-- hocico -->
    <path d="M 690 442
             C 748 428 814 444 856 480
             C 886 506 892 548 866 574
             C 832 606 772 604 728 580
             C 700 558 682 506 690 442 Z"
          fill="url(#muzzle)" stroke="none"/>
    <path d="M 706 452
             C 756 440 812 456 846 486
             C 870 508 874 540 854 558"
          fill="none" stroke="#78AFCE" stroke-width="8" opacity="0.7"/>

    <!-- nariz -->
    <path d="M 852 466
             C 886 460 910 482 904 512
             C 898 540 870 552 846 536
             C 828 524 830 492 852 466 Z"
          fill="#190524"/>
    <ellipse cx="872" cy="492" rx="9" ry="7" fill="#A9D3EC" opacity="0.85" stroke="none"/>

    <!-- ojo -->
    <path d="M 552 452
             C 574 428 618 428 642 452
             C 620 470 574 470 552 452 Z"
          fill="#F4FBFF"/>
    <circle cx="606" cy="450" r="14" fill="#190524" stroke="none"/>
    <circle cx="611" cy="445" r="4" fill="#FFFFFF" stroke="none"/>

    <!-- ceja -->
    <path d="M 538 408 C 576 384 628 384 668 406" fill="none" stroke="#190524" stroke-width="16"/>

    <!-- boca y colmillo -->
    <path d="M 734 580 C 780 594 826 588 858 568" fill="none" stroke="#190524" stroke-width="14"/>
    <path d="M 772 588 L 788 620 L 804 586 Z" fill="#F2E9D8" stroke-width="8"/>

    <!-- collar -->
    <path d="M 400 706
             C 474 742 604 750 690 706
             L 706 756
             C 616 802 468 792 380 752 Z"
          fill="#2C418A"/>
    <circle cx="548" cy="766" r="24" fill="#FFD08A" stroke-width="8"/>
    <circle cx="548" cy="766" r="9" fill="#C9A97A" stroke="none"/>

    <!-- cigarrillo -->
    <path d="M 838 556 L 960 500" stroke="#190524" stroke-width="42"/>
    <path d="M 838 556 L 960 500" stroke="#F2E9D8" stroke-width="28"/>
    <path d="M 838 556 L 884 534" stroke="#C9A97A" stroke-width="28"/>
    <path d="M 876 538 L 884 534" stroke="#8A6A45" stroke-width="28" opacity="0.55"/>
    <circle cx="964" cy="498" r="18" fill="url(#ember)" stroke-width="8"/>

    <!-- humo -->
    <path d="M 980 474
             C 1016 440 944 414 976 372
             C 1006 332 954 310 974 272"
          fill="none" stroke="#9CCFF0" stroke-width="12" opacity="0.5"/>
    <path d="M 996 508
             C 1024 486 990 458 1010 436"
          fill="none" stroke="#9CCFF0" stroke-width="9" opacity="0.3"/>
  </g>

  <!-- brillo del pelaje -->
  <path d="M 402 376
           C 456 330 536 318 604 336
           C 540 340 468 362 420 414 Z"
        fill="#D6F1FF" opacity="0.35"/>
</svg>
